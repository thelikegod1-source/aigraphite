<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deep Ball</title>
<meta name="description" content="1v1 NBA knowledge game. The AI judge rewards the deepest correct pull.">
<meta name="theme-color" content="#0d1420">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deep Ball">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ffb238'/><path d='M4 50h92M50 4v92M18 18c18 18 18 46 0 64M82 18c-18 18-18 46 0 64' stroke='%230d1420' stroke-width='5' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;700&family=Chivo+Mono:wght@500;700&display=swap">
<style>
/* Layout: one arena column; a scoreboard bar on top, the play area below it. Single dark look on purpose (arena at night). */
:root{
  --bg:#0d1420; --court:#152133; --line:#2a3a52; --fg:#eef2f7; --muted:#8b9bb2;
  --amber:#ffb238; --win:#4fd18b; --lose:#ff6b5e;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:1rem;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(ellipse at 50% -10%,#1d2e47 0,transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,14vw,4.6rem);line-height:.9;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--amber)}
.tag{color:var(--muted);margin:6px 0 0;max-width:40ch}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--court);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
input[type=text]{font:inherit;font-size:1.05rem;width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.75em .9em}
input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:8px;padding:.6em 1em;cursor:pointer;flex:1 1 140px;background:var(--amber);color:#1a1205}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#070b12;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.side{min-width:0}.side.r{text-align:right}
.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-family:var(--mono);font-weight:700;font-size:2rem;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.clock{font-family:var(--mono);font-weight:700;font-size:1.6rem;color:var(--lose);background:#000;border-radius:6px;padding:4px 10px;font-variant-numeric:tabular-nums;text-align:center;min-width:3.2ch}
.clock.calm{color:var(--amber)}
.prompt{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.08;text-transform:uppercase;margin:0;text-wrap:balance}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.ans{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.w{border-color:var(--win);box-shadow:0 0 0 1px var(--win) inset}
.card .a{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.card .why{color:var(--muted);font-size:.92rem}
.score{font-family:var(--mono);font-weight:700}
.score.ok{color:var(--win)}.score.bad{color:var(--lose)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--amber)}
.status{color:var(--muted);text-align:center;margin:0}
.pulse{animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.how{color:var(--muted);font-size:.92rem;margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:2.6rem;text-transform:uppercase;line-height:1;margin:0;text-align:center}
.err{color:var(--lose);font-size:.92rem;margin:0}
.ac{position:relative;flex:1 1 100%;min-width:0}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;list-style:none;margin:0;padding:4px;background:#0a1019;border:1px solid var(--amber);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sug li{padding:11px 12px;border-radius:6px;cursor:pointer;font-size:1.05rem}
.sug li[aria-selected="true"],.sug li:hover{background:var(--court);color:var(--amber)}
.cheat{margin:0;padding:12px 14px;border-radius:8px;background:rgba(255,107,94,.12);border:1px solid var(--lose);color:var(--lose);font-weight:700;text-align:center}
.hint{margin:0;font-family:var(--mono);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:rgba(255,178,56,.1);border:1px solid rgba(255,178,56,.35);border-radius:6px;padding:8px 10px}
.online{margin:0;display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.online i{width:9px;height:9px;border-radius:50%;background:var(--win);box-shadow:0 0 0 3px rgba(79,209,139,.2);flex:none}
/* Bigger screens: everything is sized in rem, so raising the base size scales the whole game up. */
@media (min-width:900px) and (min-height:600px){
  html{font-size:19px}
  .wrap{max-width:780px;gap:26px}
  body{padding-top:calc(36px + env(safe-area-inset-top,0px))}
  .board{padding:18px 22px}
  .pts{font-size:2.4rem}
  .clock{font-size:1.9rem}
}
@media (min-width:1300px) and (min-height:760px){
  html{font-size:22px}
  .wrap{max-width:900px}
}
@media (min-width:1900px) and (min-height:1000px){
  html{font-size:26px}
  .wrap{max-width:1040px}
}
#app{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.small{font-size:.9rem;color:var(--muted);margin:0}
.mono{font-family:var(--mono);overflow-wrap:anywhere;margin:0}
.ok{color:var(--win)}.bad{color:var(--lose)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .tab{flex:1 1 0;font-size:1.05rem;padding:9px 10px;background:transparent;color:var(--muted);border:1px solid var(--line)}
.tabs .tab[aria-current]{color:var(--fg);border-color:var(--amber)}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{flex:1 1 0;font-size:1.05rem;padding:10px 8px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1a1205}
button.link{background:none;border:0;color:var(--amber);font-family:var(--body);font-size:inherit;text-transform:none;letter-spacing:0;padding:0;flex:0 0 auto;text-decoration:underline}
.code{font-family:var(--mono);font-weight:700;font-size:2.8rem;letter-spacing:.3em;text-align:center;color:var(--amber);margin:4px 0}
.clues{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:1.08rem}
.clues li::marker{font-family:var(--mono);color:var(--amber)}
.clues li.new{animation:fade .5s ease-out}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scroll{overflow-x:auto}
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th,.lb td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.lb th{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lb .num{text-align:right;font-family:var(--mono)}
.lb td.nm{font-weight:700;overflow-wrap:anywhere}
.lb tr.you td{color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:1.6rem;color:var(--amber)}
.stats span{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.clues li.new,.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Deep<span> Ball</span></h1>
    <p class="tag">1v1 NBA knowledge games. Deep pulls win.</p>
  </header>
  <main id="app"></main>
</div>
<script src="app.js"></script>
</body>
</html>
