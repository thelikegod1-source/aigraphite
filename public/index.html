<style>
/* Layout: one arena column; a scoreboard bar on top, the play area below it. Single dark look on purpose (arena at night). */
:root{
  --bg:#0d1420; --court:#152133; --line:#2a3a52; --fg:#eef2f7; --muted:#8b9bb2;
  --amber:#ffb238; --win:#4fd18b; --lose:#ff6b5e;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:1rem;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(ellipse at 50% -10%,#1d2e47 0,transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,14vw,4.6rem);line-height:.9;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--amber);margin-left:.22em}
.tag{color:var(--muted);margin:6px 0 0;max-width:40ch}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--court);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
input[type=text]{font:inherit;font-size:1.05rem;width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.75em .9em}
input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:8px;padding:.6em 1em;cursor:pointer;flex:1 1 140px;background:var(--amber);color:#1a1205}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#070b12;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.side{min-width:0}.side.r{text-align:right}
.pname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-family:var(--mono);font-weight:700;font-size:2rem;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.clock{font-family:var(--mono);font-weight:700;font-size:1.6rem;color:var(--lose);background:#000;border-radius:6px;padding:4px 10px;font-variant-numeric:tabular-nums;text-align:center;min-width:3.2ch}
.clock.calm{color:var(--amber)}
.prompt{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.08;text-transform:uppercase;margin:0;text-wrap:balance}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.ans{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.w{border-color:var(--win);box-shadow:0 0 0 1px var(--win) inset}
.card .a{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.card .why{color:var(--muted);font-size:.92rem}
.score{font-family:var(--mono);font-weight:700}
.score.ok{color:var(--win)}.score.bad{color:var(--lose)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--amber)}
.status{color:var(--muted);text-align:center;margin:0}
.pulse{animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.how{color:var(--muted);font-size:.92rem;margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-size:2.6rem;text-transform:uppercase;line-height:1;margin:0;text-align:center}
.err{color:var(--lose);font-size:.92rem;margin:0}
.ac{position:relative;flex:1 1 55%;min-width:0}
#f{flex-wrap:nowrap;align-items:stretch}
#f > button{flex:0 0 auto;min-width:5.5em}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;list-style:none;margin:0;padding:4px;background:#0a1019;border:1px solid var(--amber);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sug li{padding:11px 12px;border-radius:6px;cursor:pointer;font-size:1.05rem}
.sug li[aria-selected="true"],.sug li:hover{background:var(--court);color:var(--amber)}
.cheat{margin:0;padding:12px 14px;border-radius:8px;background:rgba(255,107,94,.12);border:1px solid var(--lose);color:var(--lose);font-weight:700;text-align:center}
.hint{margin:0;font-family:var(--mono);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:rgba(255,178,56,.1);border:1px solid rgba(255,178,56,.35);border-radius:6px;padding:8px 10px}
.online{margin:0;display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.online i{width:9px;height:9px;border-radius:50%;background:var(--win);box-shadow:0 0 0 3px rgba(79,209,139,.2);flex:none}
/* Bigger screens: everything is sized in rem, so raising the base size scales the whole game up. */
@media (min-width:900px) and (min-height:600px){
  html{font-size:19px}
  .wrap{max-width:780px;gap:26px}
  body{padding-top:calc(36px + env(safe-area-inset-top,0px))}
  .board{padding:18px 22px}
  .pts{font-size:2.4rem}
  .clock{font-size:1.9rem}
}
@media (min-width:1300px) and (min-height:760px){
  html{font-size:22px}
  .wrap{max-width:900px}
}
@media (min-width:1900px) and (min-height:1000px){
  html{font-size:26px}
  .wrap{max-width:1040px}
}
#app{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.small{font-size:.9rem;color:var(--muted);margin:0}
.mono{font-family:var(--mono);overflow-wrap:anywhere;margin:0}
.ok{color:var(--win)}.bad{color:var(--lose)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .tab{flex:1 1 0;font-size:1.05rem;padding:9px 10px;background:transparent;color:var(--muted);border:1px solid var(--line)}
.tabs .tab[aria-current]{color:var(--fg);border-color:var(--amber)}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{flex:1 1 0;font-size:1.05rem;padding:10px 8px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1a1205}
button.link{background:none;border:0;color:var(--amber);font-family:var(--body);font-size:inherit;text-transform:none;letter-spacing:0;padding:0;flex:0 0 auto;text-decoration:underline}
.code{font-family:var(--mono);font-weight:700;font-size:2.8rem;letter-spacing:.3em;text-align:center;color:var(--amber);margin:4px 0}
.clues{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:1.08rem}
.clues li::marker{font-family:var(--mono);color:var(--amber)}
.clues li.new{animation:fade .5s ease-out}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scroll{overflow-x:auto}
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th,.lb td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.lb th{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lb .num{text-align:right;font-family:var(--mono)}
.lb td.nm{font-weight:700;overflow-wrap:anywhere}
.lb tr.you td{color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--mono);font-size:1.6rem;color:var(--amber)}
.stats span{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.clues li.new,.shake{animation:none}}

/* ================= Motion & arena polish ================= */
:root{--glow:0 0 0 1px rgba(255,178,56,.55),0 8px 28px -6px rgba(255,178,56,.55)}
body{position:relative;overflow-x:hidden}
/* Arena backdrop: faint court lines and a slow sweeping spotlight */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;
  background:
   radial-gradient(circle at 50% 108%,transparent 0 23vmin,#fff 23vmin calc(23vmin + 2px),transparent calc(23vmin + 3px)),
   radial-gradient(circle at 50% 108%,transparent 0 62vmin,#fff 62vmin calc(62vmin + 2px),transparent calc(62vmin + 3px)),
   linear-gradient(90deg,transparent calc(50% - 1px),#fff calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 40% 30% at 30% 20%,rgba(255,178,56,.10),transparent 70%),radial-gradient(ellipse 35% 30% at 75% 70%,rgba(79,140,255,.10),transparent 70%);
  animation:sweep 18s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translate(6%,-4%) rotate(4deg)}}

/* Title */
h1{animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}
h1 span{display:inline-block;background:linear-gradient(100deg,var(--amber) 0 40%,#fff3d6 50%,var(--amber) 60% 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s ease-in-out 1s infinite;filter:drop-shadow(0 0 18px rgba(255,178,56,.35))}
.tag{animation:fadeUp .6s .15s both}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.96)}}
@keyframes shine{0%,60%{background-position:100% 0}100%{background-position:-50% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}

/* Panels slide in, one after another */
#app > *{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
#app > *:nth-child(2){animation-delay:.06s}#app > *:nth-child(3){animation-delay:.12s}#app > *:nth-child(4){animation-delay:.18s}
#app > .still{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%),var(--court);box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}

/* Buttons: lift, glow, shine sweep, squash on press */
button{position:relative;overflow:hidden;isolation:isolate;transition:transform .16s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background-color .2s,color .2s,border-color .2s}
button:not(.link):not(:disabled):hover{transform:translateY(-2px)}
button:not(.link):not(:disabled):active{transform:translateY(1px) scale(.97);transition-duration:.06s}
button:not(.ghost):not(.link):not(.tab):not([aria-pressed]){box-shadow:0 6px 0 -1px #b87100,0 10px 24px -8px rgba(255,178,56,.6)}
button:not(.ghost):not(.link):not(.tab):not([aria-pressed]):hover{box-shadow:0 7px 0 -1px #b87100,var(--glow)}
button:not(.ghost):not(.link):not(.tab):not([aria-pressed]):active{box-shadow:0 2px 0 -1px #b87100}
button:not(.link)::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
button:not(.link):hover::after{transform:translateX(120%);transition:transform .6s ease}
button.ghost:hover,.tabs .tab:hover{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,178,56,.4),0 8px 24px -10px rgba(255,178,56,.5);color:var(--fg)}
#find{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 6px 0 -1px #b87100,0 0 0 6px rgba(255,178,56,.12),0 10px 30px -6px rgba(255,178,56,.7)}}
.tabs .tab[aria-current]{background:rgba(255,178,56,.1);box-shadow:inset 0 -3px 0 var(--amber)}
.seg button{transition:background-color .25s,color .25s,transform .16s}
.seg button[aria-pressed="true"]{box-shadow:0 4px 14px -4px rgba(255,178,56,.7)}

/* Inputs */
input[type=text]{transition:border-color .2s,box-shadow .2s}
input[type=text]:focus{box-shadow:0 0 0 4px rgba(255,178,56,.18)}
.sug li{transition:background-color .12s,color .12s,padding-left .12s}
.sug li:hover,.sug li[aria-selected="true"]{padding-left:18px}
.sug{animation:pop .16s ease-out both;transform-origin:top}

/* Scoreboard */
.board{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -20px rgba(0,0,0,.9)}
.board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,178,56,.05) 0 2px,transparent 2px 6px);pointer-events:none}
.pts{text-shadow:0 0 18px rgba(255,178,56,.45)}
.pts.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{30%{transform:scale(1.6);color:#fff}}
.clock{box-shadow:inset 0 0 12px rgba(255,107,94,.25);transition:color .2s}
.clock.calm{box-shadow:inset 0 0 12px rgba(255,178,56,.2)}
.clock:not(.calm){animation:urgent 1s ease-in-out infinite}
@keyframes urgent{50%{transform:scale(1.12);box-shadow:0 0 22px rgba(255,107,94,.7),inset 0 0 12px rgba(255,107,94,.5)}}
.dots i{transition:background-color .3s,transform .3s}.dots i.on:last-of-type,.dots i.on{transform:scale(1.15)}

/* Game moments */
.prompt{animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{from{opacity:0;transform:scale(1.15);letter-spacing:.06em}}
.card{animation:flip .5s cubic-bezier(.2,1.2,.4,1) both;transform-origin:top}
.card + .card{animation-delay:.18s}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-70deg)}}
.card.w{animation:flip .5s cubic-bezier(.2,1.2,.4,1) both,winglow 1.6s .5s ease-in-out 2}
@keyframes winglow{50%{box-shadow:0 0 0 1px var(--win) inset,0 0 26px rgba(79,209,139,.55)}}
.status.ok{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.big{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.cheat{animation:pop .4s cubic-bezier(.2,1.6,.4,1) both,shakeX .5s .4s}
@keyframes shakeX{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.code{animation:pop .5s both;text-shadow:0 0 24px rgba(255,178,56,.5)}
.online i{animation:blip 2s ease-in-out infinite}
@keyframes blip{50%{box-shadow:0 0 0 6px rgba(79,209,139,0)}0%{box-shadow:0 0 0 0 rgba(79,209,139,.5)}}
.lb tbody tr{animation:fadeUp .35s both}
.lb tbody tr:nth-child(-n+3) td.nm::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:.45em;vertical-align:.1em;background:var(--amber)}
.lb tbody tr:nth-child(2) td.nm::before{background:#c9d3e0}.lb tbody tr:nth-child(3) td.nm::before{background:#d08a4e}
.lb tbody tr:hover td{background:rgba(255,178,56,.05)}
.credit{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;
  font-size:.8rem;color:var(--muted);text-decoration:none;background:rgba(7,11,18,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;transition:color .2s,border-color .2s,transform .2s;animation:fadeUp .6s .6s both}
.credit b{color:var(--amber);font-weight:700}
.credit:hover{color:var(--fg);border-color:var(--amber);transform:translateY(-2px)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
@media (max-width:420px){.btns button{font-size:1.1rem;white-space:nowrap}}
/* Bouncing ball logo */
.ball{display:inline-block;position:relative;width:.62em;height:.62em;margin-right:.14em;vertical-align:.08em;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#ffd08a,#f08a12 55%,#9c4d00);box-shadow:inset -.05em -.06em .1em rgba(0,0,0,.35);animation:hop 1.1s cubic-bezier(.5,0,.5,1) infinite}
.ball::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(90deg,transparent 47%,#3a1a00 47% 53%,transparent 53%),linear-gradient(0deg,transparent 47%,#3a1a00 47% 53%,transparent 53%);opacity:.75}
.ball::after{content:"";position:absolute;inset:0;border-radius:50%;border:.045em solid transparent;border-left-color:#3a1a00;border-right-color:#3a1a00;transform:scaleX(.55);opacity:.75}
@keyframes hop{0%,100%{transform:translateY(-.22em)}48%{transform:translateY(.04em) scale(1.08,.9)}52%{transform:translateY(.04em) scale(1.08,.9)}}

/* Tap ripple */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Sound toggle */
.tabs .snd{flex:0 0 auto;padding:9px 14px;font-size:1.05rem}


/* Overlays: VS intro and round banners */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
.vs-wrap{background:radial-gradient(circle,rgba(13,20,32,.75),rgba(13,20,32,.95));animation:fadeOut .4s 1.6s forwards}
.vs{display:grid;justify-items:center;gap:.2em;font-family:var(--display);text-transform:uppercase;text-align:center;padding:0 16px}
.vs span{font-size:clamp(2rem,9vw,4rem);line-height:1;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .vs-a{color:var(--fg);animation:inL .5s cubic-bezier(.2,1.3,.4,1) both}
.vs .vs-b{color:var(--fg);animation:inR .5s .15s cubic-bezier(.2,1.3,.4,1) both}
.vs b{font-weight:400;font-size:clamp(3rem,14vw,6rem);color:var(--amber);text-shadow:0 0 30px rgba(255,178,56,.7);animation:slamIn .45s .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes inL{from{opacity:0;transform:translateX(-60vw) skewX(-12deg)}}
@keyframes inR{from{opacity:0;transform:translateX(60vw) skewX(-12deg)}}
@keyframes slamIn{from{opacity:0;transform:scale(3) rotate(-8deg)}}
@keyframes fadeOut{to{opacity:0}}
.banner{font-family:var(--display);text-transform:uppercase;font-size:clamp(2.6rem,12vw,5rem);color:var(--amber);
  text-shadow:0 0 28px rgba(255,178,56,.6),0 4px 0 #6b3d00;padding:.1em .6em;background:linear-gradient(90deg,transparent,rgba(13,20,32,.92) 20% 80%,transparent);
  animation:sweepIn .9s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes sweepIn{0%{opacity:0;transform:translateX(-40vw) skewX(-15deg)}25%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40vw) skewX(-15deg)}}

/* End screen */
.end{align-items:center;text-align:center}
.trophy{font-size:4.2rem;line-height:1;animation:trophy .9s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 8px 20px rgba(255,178,56,.45))}
.end.lost .trophy{filter:none}
@keyframes trophy{from{opacity:0;transform:translateY(-40px) scale(.3) rotate(-25deg)}}
.end.won{box-shadow:0 0 0 1px rgba(79,209,139,.5),0 0 50px -10px rgba(79,209,139,.5)}
.end .btns{width:100%}

/* NBA-style shot clock: black housing, red 7-segment LEDs, light bar that drains and flashes at zero */
.clock{position:relative;display:grid;justify-items:center;gap:3px;min-width:0;padding:6px 8px 5px;border-radius:7px;
  background:linear-gradient(180deg,#1d2026,#07080a 60%);border:2px solid #34383f;box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 0 0 1px #000,0 6px 16px -6px rgba(0,0,0,.9);color:#ff2a1a}
.clock.calm{color:#ff2a1a;box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 0 0 1px #000,0 6px 16px -6px rgba(0,0,0,.9)}
.sc-bar{display:block;width:100%;height:5px;border-radius:3px;background:#2a0805;overflow:hidden;box-shadow:inset 0 0 3px #000}
.sc-bar i{display:block;height:100%;width:calc(var(--p,0) * 100%);background:linear-gradient(90deg,#ff5a3c,#ff2a1a);box-shadow:0 0 8px #ff2a1a;transition:width .25s linear}
.clock.zero .sc-bar i{width:100%;animation:flash .25s steps(2) infinite}
@keyframes flash{50%{opacity:.15}}
.sc-digits{display:flex;gap:3px;padding:3px 5px;background:#0b0303;border-radius:3px;box-shadow:inset 0 0 6px #000}
.sc-digits svg{width:1.05em;height:1.75em;display:block;font-size:1rem}
.sc-digits polygon{fill:#2b0a07}
.sc-digits polygon.on{fill:#ff2a1a;filter:drop-shadow(0 0 2px #ff2a1a) drop-shadow(0 0 6px rgba(255,42,26,.7))}
.sc-label{font-family:var(--mono);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:#7d838c}
.clock:not(.calm){animation:none}
.clock:not(.calm) .sc-digits polygon.on{animation:ledpulse 1s ease-in-out infinite}
@keyframes ledpulse{50%{fill:#ff8a7a;filter:drop-shadow(0 0 4px #ff2a1a) drop-shadow(0 0 12px #ff2a1a)}}
@media (min-width:900px) and (min-height:600px){.sc-digits svg{width:1.3em;height:2.15em}}
/* Spin & Draft */
.seg button{font-size:.98rem;padding:10px 4px}
.wheel{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:6px auto 4px;border-radius:50%;
  box-shadow:0 0 0 6px #0a0f18,0 0 0 9px var(--amber),0 0 40px rgba(255,178,56,.35),0 20px 40px -10px #000}
.wheel-rot{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.wheel-svg{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-14px;z-index:2;width:0;height:0;transform:translateX(-50%);border:14px solid transparent;border-top:26px solid #fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.hub{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;pointer-events:none}
.landed{display:grid;gap:2px;text-align:center;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 55%,#000));
  border:2px solid var(--c2);box-shadow:0 10px 30px -10px var(--c1);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.landed b{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,8vw,2.6rem);text-transform:uppercase;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.landed .label,.landed .small{color:rgba(255,255,255,.85)}
.chip{display:inline-grid;place-items:center;min-width:3.1em;padding:3px 5px;border-radius:5px;font-family:var(--mono);font-size:.72rem;font-weight:700;
  background:var(--c1);color:#fff;border:1px solid var(--c2);text-shadow:0 1px 1px rgba(0,0,0,.5)}
.pick{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--amber);border-radius:8px;animation:pop .4s both}
.pick b{display:block;font-size:1.15rem}.pick span{font-size:.85rem;color:var(--muted)}.pick em{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--amber);font-size:1.3rem}
.rosters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.rosters{grid-template-columns:1fr}}
.roster{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid var(--line);animation:fadeUp .3s both}
.slot.empty{opacity:.45}.slot .num{font-family:var(--mono);color:var(--muted);min-width:3.1em;text-align:center}
.slot .sn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot .sn.muted{color:var(--muted);font-weight:400}
.slot .rt{font-family:var(--mono);color:var(--amber);font-weight:700}
.games{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.games span{font-family:var(--mono);font-size:.8rem;padding:5px 8px;border-radius:5px;animation:pop .3s both}
.games span.w{background:rgba(79,209,139,.18);color:var(--win);border:1px solid var(--win)}
.games span.l{background:rgba(255,107,94,.12);color:var(--lose);border:1px solid var(--lose)}
.need{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.need .label{width:100%}
.needpos{display:inline-block;font-family:var(--mono);font-size:.75rem;font-weight:700;padding:3px 7px;border-radius:5px;background:rgba(255,178,56,.14);color:var(--amber);border:1px solid rgba(255,178,56,.4);vertical-align:.15em}
.slot .pos{font-family:var(--mono);font-weight:700;font-size:.78rem;color:var(--amber);min-width:2.6em;text-align:center}
.slot .sn .chip{font-size:.6rem;min-width:0;padding:1px 4px;margin-left:4px;vertical-align:.1em}
.sug li small{margin-left:8px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
/* Troll menu (owner only) */
.troll-fab{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;width:52px;height:52px;padding:0;border-radius:50%;
  font-size:1.6rem;flex:none;background:#3a0d2e;border:2px solid #ff4fb4;box-shadow:0 0 20px rgba(255,79,180,.5)!important;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(14deg)}95%{transform:rotate(-8deg)}}
.troll-menu{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgba(0,0,0,.55);padding:16px;animation:fadeUp .2s both}
.tm-card{width:min(520px,100%);background:#1a0f22;border:1px solid #ff4fb4;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 40px rgba(255,79,180,.35)}
.tm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tm{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.95rem;padding:10px;display:flex;gap:8px;align-items:center;text-align:left;border-color:#5a2a55!important}
.tm span{font-size:1.3rem}
.troll-flip body{transform:rotate(180deg);transition:transform .5s}
.troll-spin body{animation:tspin 2s cubic-bezier(.4,0,.2,1)}
@keyframes tspin{to{transform:rotate(720deg)}}
.troll-shake body{animation:tshake .12s linear 15}
@keyframes tshake{25%{transform:translate(-8px,4px) rotate(-1deg)}75%{transform:translate(8px,-4px) rotate(1deg)}}
.troll-zoom body{transform:scale(2.4);transform-origin:50% 30%;transition:transform .4s}
html body{transition:transform .5s}
.brick{position:fixed;top:-40px;z-index:65;font-size:2rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.troll-pop{background:rgba(0,0,0,.5)}
.fake-alert{background:#fff;color:#111;border-radius:14px;padding:18px 20px;max-width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .3s both}
.fake-alert b{font-size:1.15rem;color:#d00}.fake-alert p{margin:8px 0}.fake-alert .small{color:#555}
.troll-on{margin:0;font-size:.85rem;color:#ff79c6;background:rgba(255,79,180,.1);border:1px solid rgba(255,79,180,.4);border-radius:6px;padding:6px 10px}
/* Support tab */
.tabs .heart{flex:0 0 auto;padding:9px 13px;font-size:1.05rem}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:var(--display);font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;
  border-radius:8px;padding:.6em 1em;flex:1 1 140px;background:var(--amber);color:#1a1205;box-shadow:0 6px 0 -1px #b87100,0 10px 24px -8px rgba(255,178,56,.6);transition:transform .16s}
a.btn:hover{transform:translateY(-2px)}
.support-hero{text-align:center;align-items:center}
.support-hero .status{max-width:44ch}
.plus{border-color:rgba(255,178,56,.55);box-shadow:0 0 0 1px rgba(255,178,56,.25),0 20px 50px -25px rgba(255,178,56,.6)}
.price{font-family:var(--mono);color:var(--muted)}.price b{font-size:1.6rem;color:var(--amber)}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.perks li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.perks .pi{font-size:1.6rem;line-height:1}
.perks p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.soon{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px;vertical-align:.15em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--amber)}
.opt.locked{opacity:.55;cursor:default}
.plustag,.star{font-size:.72rem;font-family:var(--mono);color:var(--amber)}
.star{font-size:.85em}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams ul,.plist{margin:6px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.teams .muted,.muted{color:var(--muted)}
.bround{display:flex;flex-direction:column;gap:6px}
.bmatch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03)}
.bmatch.live{border-color:var(--amber)}
.bmatch em{font-style:normal;color:var(--muted);font-size:.85rem}
.bmatch b{margin-left:auto;font-size:.88rem;color:var(--win)}
.bmatch .you{color:var(--amber);font-weight:700}
textarea{font:inherit;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.7em .8em;resize:vertical}
textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
.policy .small{line-height:1.5}
.plogo{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px -8px rgba(255,178,56,.6)}
.dm-tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.03)}
.dm-tip .pi{font-size:1.6rem;line-height:1}.dm-tip p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
a.btn.ghostlink{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
/* ================= ESPN-style broadcast package ================= */
:root{--cond:"Barlow Condensed","Arial Narrow",sans-serif;--slab:linear-gradient(180deg,#ffc45e,#ffb238 45%,#e8940f);--navy2:#0a1a33}
/* Network header: on-air bug + live clock */
.net{position:relative}
.netbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.onair{display:inline-flex;align-items:center;gap:7px;font-family:var(--cond);font-style:italic;font-weight:800;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,#ff3b2f,#c4140b);padding:3px 12px 3px 10px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);padding-right:18px}
.onair i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blinkdot 1.2s steps(2) infinite}
@keyframes blinkdot{50%{opacity:.2}}
.netclock{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-style:italic;transform:skewX(-6deg);transform-origin:left}
h1 span{font-style:italic}
/* Section tabs: every panel's first label becomes a slanted broadcast tab */
.panel{position:relative;overflow:hidden;border-radius:4px 14px 4px 14px;border-left:4px solid var(--amber)}
.panel > .label:first-child,.panel > .row:first-child .label,.panel > label.label:first-child{align-self:flex-start;display:inline-block;font-family:var(--cond);font-style:italic;font-weight:800;font-size:.95rem;
  letter-spacing:.1em;color:#1a1205;background:var(--slab);padding:4px 18px 4px 12px;margin:-18px 0 0 -22px;clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
/* Wipe on entry */
#app > .panel:not(.still)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,178,56,.35) 45%,rgba(255,255,255,.5) 50%,rgba(255,178,56,.35) 55%,transparent 65%);
  transform:translateX(-120%);animation:wipe .9s .1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes wipe{to{transform:translateX(120%)}}
/* Big broadcast type */
.big,.prompt,button,a.btn{font-style:italic}
.prompt{transform:skewX(-4deg)}
/* Mode segment cards */
.segcards{display:grid;gap:10px}
.segcard{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:14px 16px;
  border-radius:4px 14px 4px 14px;background:linear-gradient(110deg,#13243f,#0c1626 70%);border:1px solid var(--line)!important;box-shadow:none!important;color:var(--fg);font-style:normal;text-transform:none;letter-spacing:0}
.segcard .ic{grid-row:1/3;font-size:2.1rem;width:56px;height:56px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.05)}
.segcard b{font-family:var(--display);font-weight:400;font-style:italic;font-size:1.6rem;text-transform:uppercase;line-height:1}
.segcard span.sub{font-family:var(--body);font-size:.9rem;color:var(--muted)}
.segcard[aria-pressed="true"]{background:linear-gradient(110deg,#3a2a0a,#1a1408 75%);border-color:var(--amber)!important;box-shadow:0 0 0 1px var(--amber),0 12px 30px -12px rgba(255,178,56,.7)!important}
.segcard[aria-pressed="true"] b{color:var(--amber)}
.segcard[aria-pressed="true"]::before{content:"SELECTED";position:absolute;right:10px;top:8px;font-family:var(--cond);font-style:italic;font-weight:800;font-size:.7rem;letter-spacing:.14em;color:#1a1205;background:var(--slab);padding:2px 8px}
/* Player strip */
.pstrip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--cond);font-style:italic;font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.pstrip .elo{font-family:var(--mono);font-style:normal;font-size:.9rem;color:var(--fg);background:#000;padding:4px 10px;border:1px solid var(--line)}
/* TV score bug */
.board{border-radius:0;padding:0;gap:0;background:#05080e;border:1px solid #1d2a40;grid-template-columns:1fr auto 1fr;overflow:hidden}
.board::before{display:none}
.board .side{padding:10px 14px;background:linear-gradient(180deg,#123866,#0a1f3d);position:relative;min-height:100%}
.board .side.r{background:linear-gradient(180deg,#5a1414,#300a0a)}
.board .side::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber)}
.board .side.r::after{background:#ff6b5e}
.board .label{color:rgba(255,255,255,.7)}
.board .pname{font-family:var(--cond);font-style:italic;font-weight:800;font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
.board .pts{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.35)}
.board .clock{margin:6px}
/* Lower-third round banners */
.overlay:has(.banner){place-items:end start;padding:0 0 calc(70px + env(safe-area-inset-bottom,0px)) 0}
.banner{background:none;padding:0;text-shadow:none;animation:l3 1s cubic-bezier(.2,.9,.3,1) forwards;display:flex;flex-direction:column;font-size:clamp(2rem,9vw,3.4rem)}
.banner::before{content:"DEEP BALL";display:block;font-family:var(--cond);font-weight:800;font-size:.9rem;letter-spacing:.2em;color:#1a1205;background:#fff;padding:3px 14px;width:max-content}
.banner{color:#1a1205;background:var(--slab);padding:6px 40px 6px 16px;clip-path:polygon(0 0,100% 0,94% 100%,0 100%);box-shadow:0 10px 30px rgba(0,0,0,.6)}
@keyframes l3{0%{transform:translateX(-110%)}18%,78%{transform:none}100%{transform:translateX(-110%)}}
/* Bottom ticker */
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;align-items:stretch;height:calc(38px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg,#0e1b30,#060b14);border-top:2px solid var(--amber);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.tk-label{flex:none;display:flex;flex-direction:column;justify-content:center;line-height:.9;font-family:var(--cond);font-style:italic;font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:#1a1205;background:var(--slab);padding:0 18px 0 max(12px,env(safe-area-inset-left,0px));clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.tk-label b{font-size:.9rem}
.tk-track{flex:1;overflow:hidden;display:flex;align-items:center;-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tk-run{display:flex;white-space:nowrap;animation:tick var(--dur,60s) linear infinite}
.tk-run span{font-family:var(--cond);font-weight:700;font-size:1rem;text-transform:uppercase;letter-spacing:.04em;padding:0 22px;border-right:1px solid #24324a;color:#dfe6ef}
.tk-run span b{color:var(--amber);font-weight:800}
.tk-run a{color:var(--amber);text-decoration:none}
@keyframes tick{to{transform:translateX(-50%)}}
.troll-fab{bottom:calc(52px + env(safe-area-inset-bottom,0px))}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.tk-run{animation:none}}
@media (max-width:520px){.segcard[aria-pressed="true"]::before{display:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  body::after{animation:none}
}

/* ================= Pro refresh: flat, sharp, calm (overrides everything above) ================= */
:root{--display:"Barlow Condensed","Arial Narrow",sans-serif;--line:#223047;--court:#111b2b;--bg:#0a111c}
body{background-image:none;background:var(--bg)}
body::after{display:none}
body::before{opacity:.035}
h1{font-family:var(--display);font-weight:800;font-style:normal;transform:none;letter-spacing:-.01em;font-size:clamp(2.8rem,12vw,4.2rem);animation:none}
h1 span{font-style:normal;background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--amber);filter:none;animation:none;margin-left:.18em}
.tag{color:var(--muted);font-size:.95rem}
.onair{font-style:normal;clip-path:none;background:none;color:#ff4a3d;border:1px solid rgba(255,74,61,.45);padding:2px 10px;border-radius:999px;font-size:.78rem;letter-spacing:.16em}
.onair i{background:#ff4a3d}
/* Surfaces */
.panel{border-radius:10px;border:1px solid var(--line);border-left:1px solid var(--line);background:var(--court);box-shadow:none}
#app > .panel:not(.still)::after{display:none}
#app > *{animation:fadeUp .35s ease-out both}
.panel > .label:first-child,.panel > .row:first-child .label,.panel > label.label:first-child{margin:0;padding:0 0 0 10px;background:none;clip-path:none;color:var(--muted);
  font-family:var(--mono);font-style:normal;font-weight:500;font-size:.72rem;letter-spacing:.16em;border-left:2px solid var(--amber)}
/* Type: no slant anywhere */
.big,.prompt,button,a.btn,.pname,.pstrip,.segcard b,.tk-run span,.tk-label,.banner{font-style:normal!important}
.prompt{transform:none;font-family:var(--display);font-weight:800;letter-spacing:0}
.big{font-family:var(--display);font-weight:800}
/* Buttons: flat, sharp, no 3D, no shine */
button,a.btn{font-family:var(--display);font-weight:700;letter-spacing:.06em;border-radius:6px;transition:background-color .15s,border-color .15s,color .15s,opacity .15s}
button:not(.ghost):not(.link):not(.tab):not([aria-pressed]),a.btn{box-shadow:none!important;background:var(--amber);color:#16110a}
button:not(.ghost):not(.link):not(.tab):not([aria-pressed]):hover,a.btn:hover{background:#ffc25e;transform:none!important}
button:not(.link):not(:disabled):hover,button:not(.link):not(:disabled):active{transform:none!important}
button:not(.link)::after{display:none}
button.ghost:hover,.tabs .tab:hover{box-shadow:none;border-color:#3a4c6a}
#find{animation:none}
.ripple{background:rgba(255,255,255,.18)}
.troll-fab{animation:none}
/* Nav */
.tabs .tab{font-family:var(--display);font-weight:700;border-radius:6px;background:transparent;border:1px solid var(--line)}
.tabs .tab[aria-current]{background:rgba(255,178,56,.08);box-shadow:inset 0 -2px 0 var(--amber);border-color:var(--line)}
.tabs .heart,.tabs .snd{display:grid;place-items:center;padding:0 12px}
.tabs svg{width:20px;height:20px}
/* Mode cards */
.segcard{border-radius:10px;background:#0d1626}
.segcard .ic{background:none;border:1px solid var(--line);border-radius:10px;width:48px;height:48px;color:var(--muted)}
.segcard .ic svg{width:24px;height:24px}
.segcard b{font-family:var(--display);font-weight:800;font-style:normal;font-size:1.45rem;letter-spacing:.01em}
.segcard[aria-pressed="true"]{background:#141d2c;box-shadow:inset 3px 0 0 var(--amber)!important;border-color:#3a4c6a!important}
.segcard[aria-pressed="true"] .ic{color:var(--amber);border-color:rgba(255,178,56,.5)}
.segcard[aria-pressed="true"]::before{display:none}
.pstrip{font-family:var(--display);font-weight:700;font-style:normal}
.pstrip .elo{border-radius:6px;background:transparent}
/* Scoreboard: clean */
.board{border-radius:10px;border:1px solid var(--line);background:#070c15}
.board .side,.board .side.r{background:transparent}
.board .side::after{height:2px}
.board .pname{font-family:var(--display);font-weight:700;text-transform:none;font-size:1.1rem}
.board .pts{text-shadow:none;font-family:var(--mono)}
.pts.bump{animation:none}
/* Calm moments */
.trophy{font-size:inherit;filter:none;animation:fadeUp .4s both;color:var(--amber);width:64px;height:64px}
.end.lost .trophy{color:var(--muted)}
.end.won{box-shadow:none;border-color:rgba(79,209,139,.5)}
.trophy svg{width:100%;height:100%}
.card,.card.w,.prompt,.status.ok,.big,.code,.cheat,.sug,.landed,.pick,.slot{animation-duration:.3s!important;animation-name:fadeUp!important;animation-iteration-count:1!important}
.card.w{box-shadow:inset 0 0 0 1px var(--win)}
.code{text-shadow:none}
.hint{border-radius:6px}
/* Lower thirds: flat */
.banner{background:#f2f4f7;color:#0a111c;clip-path:none;border-left:6px solid var(--amber);font-family:var(--display);font-weight:800;text-transform:uppercase;padding:6px 26px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.banner::before{background:none;color:#5b6678;padding:0;letter-spacing:.24em;font-size:.72rem}
.vs b{text-shadow:none}
.vs span,.vs b{font-family:var(--display);font-weight:800}
/* Ticker: flat */
.ticker{background:#070c15;border-top:1px solid var(--line);box-shadow:none}
.tk-label{clip-path:none;background:none;color:var(--amber);border-right:1px solid var(--line);font-family:var(--mono);font-weight:500;font-size:.62rem;letter-spacing:.14em}
.tk-label b{font-size:.62rem;font-weight:500}
.tk-run span{font-family:var(--display);font-weight:600;letter-spacing:.03em;text-transform:none;color:#c6cfdb}
.online i{animation:none}
@media (prefers-reduced-motion:reduce){#app > *{animation:none}}

/* Ragdoll Hoops */
.hoops{display:flex;flex-direction:column;gap:12px}
.hp-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.hp-sc{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;text-transform:uppercase;min-width:0}
.hp-sc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-sc b{font-family:var(--mono);font-size:2rem;line-height:1}
.hp-sc.blue b{color:#5b8fff}.hp-sc.red{justify-content:flex-end}.hp-sc.red b{color:#ff5d5d}
.hp-mid{text-align:center;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.1rem;display:grid}
.hp-mid small{font-family:var(--mono);font-weight:500;font-size:.62rem;letter-spacing:.1em;color:var(--muted)}
.hp-wrap{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hp-wrap canvas{display:block;width:100%;height:auto;touch-action:none}
.hp-msg{position:absolute;left:50%;top:18%;transform:translate(-50%,-10px);font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(1.4rem,6vw,2.6rem);
  color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.8);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.hp-msg.on{opacity:1;transform:translate(-50%,0)}
.hp-end{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:rgba(7,12,21,.82)}
.hp-ctrl{display:flex;gap:12px}
.hp-btn{flex:1;min-height:84px;font-size:1.4rem;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.hp-btn small{font-family:var(--mono);font-size:.65rem;opacity:.7}
.hp-btn.blue{background:#2f62d8!important;color:#fff!important}.hp-btn.red{background:#c63a3a!important;color:#fff!important}
.hp-btn:active{filter:brightness(1.2)}
.hp-help{text-align:center}

/* Street Hoops 3D */
.h3{display:flex;flex-direction:column;gap:12px}
.h3-wrap{position:relative;width:100%;height:min(72vh,640px);border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.h3-wrap canvas{display:block;width:100%;height:100%}
.h3-banner{position:absolute;left:0;right:0;top:0;height:30px;overflow:hidden;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.35));border-bottom:2px solid #ffd23a;z-index:2;pointer-events:none}
.h3-run{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.08em;color:#ffd23a;line-height:30px;animation:tick 14s linear infinite;width:max-content}
.h3-poss{position:absolute;left:12px;top:40px;z-index:2;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:.95rem;letter-spacing:.06em;background:rgba(0,0,0,.5);padding:3px 10px;border-left:3px solid #ffd23a;pointer-events:none}
.h3-stick{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);z-index:3;display:grid;place-items:center;touch-action:none}
.h3-stick i{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .05s}
.h3-stick{width:104px!important;height:104px!important;left:14px!important;bottom:14px!important}
.h3-shoot{position:absolute;right:14px;bottom:18px;width:96px;height:96px;border-radius:50%!important;padding:0;z-index:3;flex:none;background:rgba(255,178,56,.94)!important;color:#16110a!important;font-size:1.15rem;touch-action:none;display:grid;place-content:center;line-height:1}
.h3-steal{position:absolute;right:30px;bottom:124px;width:64px;height:64px;border-radius:50%!important;padding:0;z-index:3;flex:none;background:rgba(80,190,255,.92)!important;color:#08131c!important;font-size:.85rem;touch-action:none;display:grid;place-content:center;line-height:1}
.h3-steal small{font-family:var(--mono);font-size:.58rem;opacity:.7}
.h3-steal.off{display:none}
.h3-shoot small{font-family:var(--mono);font-size:.62rem;opacity:.7}
.h3-moves{position:absolute;right:118px;bottom:14px;z-index:3;display:grid;grid-template-columns:repeat(2,52px);gap:5px}
.h3-moves.off{opacity:.25;pointer-events:none}
.h3-mv{width:52px;height:40px;padding:0;border-radius:10px!important;font-size:.72rem;letter-spacing:.02em;background:rgba(10,17,28,.72)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;display:grid;place-content:center;line-height:1.05;touch-action:none;flex:none}
.h3-mv small{font-family:var(--mono);font-size:.55rem;opacity:.6}
/* 2K-style shot meter with a green window */
.h3-meter{position:absolute;z-index:4;width:16px;height:120px;border-radius:8px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85);overflow:hidden;opacity:0;transition:opacity .1s;pointer-events:none}
.h3-meter.on{opacity:1}
.h3-meter i{position:absolute;left:0;right:0;display:block}
.h3-green{background:#3ad46b;box-shadow:0 0 10px #3ad46b;opacity:.95}
.h3-fill{bottom:0;background:linear-gradient(0deg,#ffd23a,#fff);mix-blend-mode:normal;opacity:.85;border-top:2px solid #fff}
.h3-fill.in{background:linear-gradient(0deg,#3ad46b,#bfffcf)}
.h3-fb{position:absolute;left:50%;top:34%;transform:translate(-50%,0) scale(.8);z-index:4;font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.h3-fb.on{opacity:1;transform:translate(-50%,0) scale(1)}
.h3-fb.g{color:#3ad46b}.h3-fb.r{color:#ff8a5c}
.h3-wrap .hp-msg{z-index:4;top:22%}
.h3-wrap .hp-end{z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <header class="net">
    <div class="netbar"><span class="onair"><i></i>Live</span><span class="netclock" id="netclock"></span></div>
    <h1>Deep<span> Ball</span></h1>
    <p class="tag">1v1 NBA knowledge games. Deep pulls win.</p>
  </header>
  <main id="app"></main>
</div>
<div class="ticker" role="marquee" aria-label="Deep Ball ticker"><span class="tk-label">Deep Ball<b>Ticker</b></span><div class="tk-track"><div class="tk-run" id="tk"></div></div></div>
<script src="support-config.js"></script>
<script src="franchises.js"></script>
<script src="app.js"></script>
<script src="hoops.js"></script>
